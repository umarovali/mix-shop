<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <title>Mix shop sport — спортивный магазин</title>
  <defs>
    <clipPath id="leftHalf"><rect x="0" y="0" width="300" height="420"/></clipPath>
    <clipPath id="rightHalf"><rect x="300" y="0" width="300" height="420"/></clipPath>
  </defs>

  <!-- ручки сумок -->
  <path d="M234 112 V76 a27 27 0 0 1 54 0 V112" fill="none" stroke="#2B2B2B" stroke-width="16"/>
  <path d="M312 112 V76 a27 27 0 0 1 54 0 V112" fill="none" stroke="#E8141B" stroke-width="16"/>

  <!-- корпус сумки: левая тёмная, правая красная -->
  <rect x="200" y="106" width="200" height="146" rx="16" fill="#2B2B2B" clip-path="url(#leftHalf)"/>
  <rect x="200" y="106" width="200" height="146" rx="16" fill="#E8141B" clip-path="url(#rightHalf)"/>

  <!-- гантели -->
  <g fill="#2B2B2B">
    <rect x="124" y="164" width="12" height="34" rx="2"/>
    <rect x="142" y="148" width="22" height="66" rx="3"/>
    <rect x="164" y="174" width="36" height="14"/>
  </g>
  <g fill="#E8141B">
    <rect x="464" y="164" width="12" height="34" rx="2"/>
    <rect x="436" y="148" width="22" height="66" rx="3"/>
    <rect x="400" y="174" width="36" height="14"/>
  </g>
  <!-- гриф продолжается внутри сумки до гири -->
  <rect x="214" y="177" width="20" height="8" fill="#FFFFFF"/>
  <rect x="366" y="177" width="20" height="8" fill="#FFFFFF"/>

  <!-- гиря -->
  <g>
    <!-- белый силуэт -->
    <path fill="#FFFFFF" d="M262 140 C262 112 278 98 300 98 C322 98 338 112 338 140 C338 148 335 154 331 158
      A64 64 0 1 1 269 158 C265 154 262 148 262 140 Z"/>
    <!-- отверстие ручки -->
    <path fill="#2B2B2B" clip-path="url(#leftHalf)" d="M280 140 C280 124 288 116 300 116 C312 116 320 124 320 140 C320 145 318 148 316 150 L284 150 C282 148 280 145 280 140 Z"/>
    <path fill="#E8141B" clip-path="url(#rightHalf)" d="M280 140 C280 124 288 116 300 116 C312 116 320 124 320 140 C320 145 318 148 316 150 L284 150 C282 148 280 145 280 140 Z"/>
    <!-- тело гири -->
    <circle cx="300" cy="206" r="48" fill="#2B2B2B" clip-path="url(#leftHalf)"/>
    <circle cx="300" cy="206" r="48" fill="#E8141B" clip-path="url(#rightHalf)"/>
    <circle cx="300" cy="206" r="30" fill="#FFFFFF"/>
    <circle cx="300" cy="206" r="22" fill="#E8141B"/>
    <path d="M262 214 A40 40 0 0 0 338 214" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- надписи -->
  <text x="300" y="334" text-anchor="middle" fill="#1A1A1A"
    font-family="'Segoe UI', Montserrat, Arial, sans-serif" font-weight="400" font-size="62">Mix shop sport</text>
  <text x="300" y="384" text-anchor="middle" fill="#E8141B"
    font-family="'Segoe UI', Montserrat, Arial, sans-serif" font-weight="400" font-size="30">Спортивный магазин</text>
</svg>
