<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760">
  <title>Mix Shop Med — медицинские товары</title>
  <!-- внешнее кольцо -->
  <circle cx="300" cy="300" r="262" fill="none" stroke="#36474F" stroke-width="24"/>

  <!-- соединители (3 луча через 120°) -->
  <g fill="#1B8E9C">
    <rect x="292" y="183" width="16" height="25" rx="2"/>
    <rect x="292" y="183" width="16" height="25" rx="2" transform="rotate(120 300 300)"/>
    <rect x="292" y="183" width="16" height="25" rx="2" transform="rotate(240 300 300)"/>
  </g>

  <!-- узлы -->
  <g fill="#1B8E9C">
    <circle cx="300" cy="140" r="31"/>
    <circle cx="300" cy="140" r="31" transform="rotate(120 300 300)"/>
    <circle cx="300" cy="140" r="31" transform="rotate(240 300 300)"/>
  </g>

  <!-- центр с крестом -->
  <circle cx="300" cy="300" r="80" fill="#36474F"/>
  <path fill="#FFFFFF" d="
    M282 252 h36 a6 6 0 0 1 6 6 v24 h24 a6 6 0 0 1 6 6 v24 a6 6 0 0 1 -6 6 h-24 v24 a6 6 0 0 1 -6 6 h-36
    a6 6 0 0 1 -6 -6 v-24 h-24 a6 6 0 0 1 -6 -6 v-24 a6 6 0 0 1 6 -6 h24 v-24 a6 6 0 0 1 6 -6 z"/>
  <!-- надписи -->
  <text x="300" y="664" text-anchor="middle" fill="#36474F"
    font-family="'Segoe UI', Montserrat, Arial, sans-serif" font-weight="600" font-size="64">Mix Shop Med</text>
  <text x="300" y="716" text-anchor="middle" fill="#1B8E9C"
    font-family="'Segoe UI', Montserrat, Arial, sans-serif" font-weight="400" font-size="32">Медицинские товары</text>
</svg>
